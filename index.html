<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biuro Inżynierskie Łukasz Karczewski</title>
    <style>
        /* GŁÓWNE KOLORY */
        :root {
            --dark-card: rgba(35, 39, 42, 0.92); /* Ciemna karta, lekko przezroczysta */
            --accent-blue: #3498db;
            --accent-hover: #2980b9;
            --white-text: #ffffff;
            --grey-text: #bdc3c7;
        }

        /* USTAWIENIA TŁA CAŁEJ STRONY */
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Pozwala na skrolowanie od góry */
            overflow-y: auto;
            padding: 40px 0;

            /* ZABEZPIECZENIE: Ciemny kolor, jeśli zdjęcie się nie wczyta */
            background-color: #1a1c1e; 
            
            /* TWOJE ZDJĘCIE - musi nazywać się bg.jpg */
            background-image: url('bg.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
        }

        /* KARTA GŁÓWNA */
        .container {
            background-color: var(--dark-card);
            backdrop-filter: blur(10px); /* Efekt rozmytego szkła pod kartą */
            -webkit-backdrop-filter: blur(10px);
            padding: 40px 30px;
            border-radius: 30px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.7);
            max-width: 420px;
            width: 88%;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            margin: auto;
        }

        /* LOGO */
        .logo-box {
            width: 140px;
            height: 140px;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .logo-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* NAGŁÓWKI */
        .brand-sub {
            display: block;
            font-size: 1.7rem;
            font-weight: 800;
            color: var(--grey-text);
            text-transform: uppercase;
            margin-bottom: 5px;
            letter-spacing: 1px;
        }
        .brand-main {
            display: block;
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--white-text);
            margin-bottom: 40px;
            line-height: 1.1;
        }

        /* PRZYCISKI */
        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .btn {
            background-color: var(--accent-blue);
            color: white;
            border: none;
            padding: 22px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }
        .btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }

        /* SEKCJE ROZWIJANE */
        .section {
            display: none;
            text-align: left;
            animation: fadeIn 0.4s ease;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        ul { list-style: none; padding: 0; }
        li {
            padding: 14px;
            background: rgba(255,255,255,0.05);
            margin-bottom: 10px;
            border-radius: 15px;
            border-left: 5px solid var(--accent-blue);
            font-size: 16px;
            color: var(--white-text);
        }

        /* KONTAKT */
        .contact-link {
            display: block;
            color: var(--accent-blue);
            text-decoration: none;
            font-size: 1.3rem;
            font-weight: bold;
            margin: 25px 0;
            text-align: center;
        }

        .btn-back {
            background: none;
            border: 1px solid var(--grey-text);
            color: var(--grey-text);
            padding: 12px;
            border-radius: 15px;
            width: 100%;
            cursor: pointer;
            margin-top: 20px;
            font-weight: bold;
        }

        /* DOPASOWANIE DO MAŁYCH EKRANÓW */
        @media (max-width: 380px) {
            .brand-sub { font-size: 1.4rem; }
            .brand-main { font-size: 1.8rem; }
            .container { padding: 30px 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-box">
        <img src="logo.png" alt="Logo" onerror="this.src='https://via.placeholder.com/140/23272a/3498db?text=LK'">
    </div>

    <div id="home-menu">
        <span class="brand-sub">Biuro inżynierskie</span>
        <span class="brand-main">Łukasz Karczewski</span>
        
        <div class="btn-list">
            <button class="btn" onclick="showSection('services')">Zakres usług</button>
            <button class="btn" onclick="showSection('contact')">Kontakt</button>
        </div>
    </div>

    <div id="services" class="section">
        <h2 style="text-align: center; color: var(--accent-blue);">Zakres usług</h2>
        <ul>
            <li>Projekty instalacji elektrycznych</li>
            <li>Audyty energetyczne</li>
            <li>Świadectwa charakterystyki energetycznej</li>
            <li>Nadzór nad inwestycjami</li>
            <li>Pomiary instalacji elektrycznych</li>
            <li>Termowizja</li>
        </ul>
        <button class="btn-back" onclick="goHome()">← Powrót</button>
    </div>

    <div id="contact" class="section">
        <h2 style="text-align: center; color: var(--accent-blue);">Kontakt</h2>
        <a href="mailto:karczewski.lukasz@wp.pl" class="contact-link">📧 karczewski.lukasz@wp.pl</a>
        <a href="tel:+48691443689" class="contact-link">📞 691 443 639</a>
        <button class="btn-back" onclick="goHome()">← Powrót</button>
    </div>
</div>

<script>
    function showSection(id) {
        document.getElementById('home-menu').style.display = 'none';
        document.getElementById(id).style.display = 'block';
        window.scrollTo({top: 0, behavior: 'smooth'});
    }

    function goHome() {
        document.getElementById('services').style.display = 'none';
        document.getElementById('contact').style.display = 'none';
        document.getElementById('home-menu').style.display = 'block';
        window.scrollTo({top: 0, behavior: 'smooth'});
    }
</script>

</body>
</html>
