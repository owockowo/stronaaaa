<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biuro Inżynierskie Łukasz Karczewski</title>
    <style>
        :root {
            --bg-dark: #1a1c1e;
            --card-bg: #23272a;
            --blue: #3498db;
            --blue-hover: #2980b9;
            --text: #f8f9fa;
            --text-muted: #95a5a6;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            /* POWRÓT DO SZAREGO GRADIENTU */
            background: radial-gradient(circle at center, #2c2f33 0%, #1a1c1e 100%);
            background-attachment: fixed;
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* Pozwala na przewijanie od góry */
            min-height: 100vh;
            overflow-y: auto; /* Włączone przewijanie góra-dół */
            padding: 40px 0;
        }

        .container {
            background-color: var(--card-bg);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            max-width: 400px;
            width: 90%;
            text-align: center;
            margin: auto; /* Centrowanie na środku */
        }

        .logo-box {
            width: 130px;
            height: 130px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .brand-sub {
            display: block;
            font-size: 1.3rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .brand-main {
            display: block;
            font-size: 2.1rem;
            font-weight: bold;
            color: white;
            margin-bottom: 35px;
            line-height: 1.2;
        }

        .btn-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            background-color: var(--blue);
            color: white;
            border: none;
            padding: 20px;
            border-radius: 15px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }

        .btn:hover {
            background-color: var(--blue-hover);
            transform: translateY(-2px);
        }

        .section {
            display: none;
            text-align: left;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            padding: 12px;
            background: rgba(255,255,255,0.05);
            margin-bottom: 8px;
            border-radius: 12px;
            border-left: 4px solid var(--blue);
        }

        .contact-link {
            display: block;
            color: var(--blue);
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            margin: 15px 0;
            text-align: center;
        }

        .btn-back {
            background: none;
            border: 1px solid var(--text-muted);
            color: var(--text-muted);
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 20px;
            width: 100%;
        }

        @media (max-width: 400px) {
            .brand-main { font-size: 1.8rem; }
            .container { padding: 30px 20px; }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-box">
        <img src="logo.png" alt="Logo" onerror="this.src='https://via.placeholder.com/130/23272a/3498db?text=LK'">
    </div>

    <div id="home-menu">
        <span class="brand-sub">Biuro inżynierskie</span>
        <span class="brand-main">Łukasz Karczewski</span>
        
        <div class="btn-list">
            <button class="btn" onclick="showSection('services')">Zakres usług</button>
            <button class="btn" onclick="showSection('contact')">Kontakt</button>
        </div>
    </div>

    <div id="services" class="section">
        <h3 style="text-align: center;">Zakres usług:</h3>
        <ul>
            <li>Projekty instalacji elektrycznych</li>
            <li>Audyty energetyczne</li>
            <li>Świadectwa charakterystyki energetycznej</li>
            <li>Nadzór inwestorski</li>
            <li>Pomiary elektryczne</li>
            <li>Kosztorysy budowlane</li>
        </ul>
        <button class="btn-back" onclick="goHome()">← Powrót</button>
    </div>

    <div id="contact" class="section">
        <h3 style="text-align: center;">Kontakt:</h3>
        <a href="mailto:karczewski.lukasz@wp.pl" class="contact-link">📧 karczewski.lukasz@wp.pl</a>
        <a href="tel:+48691443689" class="contact-link">📞 691 443 689</a>
        <button class="btn-back" onclick="goHome()">← Powrót</button>
    </div>
</div>

<script>
    function showSection(id) {
        document.getElementById('home-menu').style.display = 'none';
        document.getElementById(id).style.display = 'block';
        window.scrollTo(0,0);
    }

    function goHome() {
        document.getElementById('services').style.display = 'none';
        document.getElementById('contact').style.display = 'none';
        document.getElementById('home-menu').style.display = 'block';
        window.scrollTo(0,0);
    }
</script>

</body>
</html>
